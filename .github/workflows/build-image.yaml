name: build-image

on:
  push:
    branches: [main, 'v2.*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: '自定义镜像 tag（留空则用日期-sha）'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate date tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> $GITHUB_OUTPUT
          else
            SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            DATE=$(TZ='Asia/Shanghai' date '+%Y%m%d-%H%M%S')
            echo "tag=${DATE}-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Lowercase image name
        id: image_name
        run: |
          LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase=$LOWER" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to GHCR (pull base image from runshine)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_PULL_USER }}
          password: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}:latest
          build-args: |
            SECFLOW_BUILD_VERSION=${{ steps.tag.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          IMG="${{ env.REGISTRY }}/${{ steps.image_name.outputs.lowercase }}:${{ steps.tag.outputs.tag }}"
          echo "### Image built" >> $GITHUB_STEP_SUMMARY
          echo "`$IMG`" >> $GITHUB_STEP_SUMMARY
